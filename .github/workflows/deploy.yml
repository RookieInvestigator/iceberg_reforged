name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    paths: ['iceberg-vue/**']
  workflow_dispatch:

concurrency:
  group: github-iceberg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pages: write
  id-token: write

# 2026-08-16 仓储治理：git 仓库根迁移至 Iceberg/（原 iceberg-vue/.git 上移），
# 前端位于 iceberg-vue/ 子目录，所有 run 步骤与产物路径相应加 working-directory / 前缀
# 2026-09-09：GitHub Pages 不再部署完整应用，改为跳转页——旧镜像地址
# （含已收录的深链）自动跳到主站；主站由 Cloudflare Pages 的 GitHub 集成独立部署。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: iceberg-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iceberg-vue/package-lock.json
      - run: npm ci
      # BOM 守卫：PostCSS 配置探测会把带 BOM 的 package.json 解析崩（Windows 编辑器常见写入）。
      # 任何受监管文本文件（JSON/TS/Vue/CSS/MD/Python/MJS）首字节为 EF BB BF 即失败，防复发。
      - name: BOM guard
        run: |
          set -e
          for f in $(git ls-files | grep -E '\.(json|ts|tsx|js|mjs|jsx|vue|css|md|html|py)$'); do
            if [ -n "$(head -c 3 "$f" | grep -P '^\xef\xbb\xbf')" ]; then
              echo "::error file=$f::UTF-8 BOM 被禁止（PostCSS/Vite JSON 解析会崩）"
              exit 1
            fi
          done
      # P0-审计（2026-08-16）：测试与双类型检查接入 CI —— 绿了才继续构建/部署
      - run: npm run typecheck:test
      - run: npm run test
      # 字体子集新鲜度：站内语料新增用字后必须重跑 scripts/subset_fonts.py，
      # 否则新字无字形（回退系统字体）。--check 纯标准库， runner 自带 python3 即可。
      - name: Font subset freshness
        run: python3 ../scripts/subset_fonts.py --check
      # 跳转页：保留路径/参数/hash 跳到主站同位置；meta refresh 兜底无 JS；
      # canonical 归并主站根，旧收录随跳转转移。
      - name: Build redirect site
        run: |
          set -e
          mkdir -p redirect-dist
          cat > redirect-dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <title>中文兔子洞冰山图已搬迁</title>
          <link rel="canonical" href="https://iceberg.hezihezi.com/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://iceberg.hezihezi.com/">
          <script>(function(){var p=location.pathname.replace(/^\/iceberg_reforged/,'')||'/';location.replace('https://iceberg.hezihezi.com'+p+location.search+location.hash);})();</script>
          </head>
          <body>
          <p>本站已搬迁至 <a href="https://iceberg.hezihezi.com/">iceberg.hezihezi.com</a>，正在跳转……</p>
          </body>
          </html>
          EOF
          cp redirect-dist/index.html redirect-dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iceberg-vue/redirect-dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    paths: ['iceberg-vue/**']
  workflow_dispatch:

concurrency:
  group: github-iceberg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  pages: write
  id-token: write

# 前端位于 iceberg-vue/ 子目录，所有 run 步骤与产物路径相应加 working-directory / 前缀。
# GitHub Pages 只部署旧地址跳转页（含已收录深链的旧镜像地址自动跳到主站）；
# 主站（完整应用）由 Cloudflare Pages 的 GitHub 集成独立部署。
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: iceberg-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iceberg-vue/package-lock.json
      - run: npm ci
      # BOM 守卫：PostCSS 配置探测会把带 BOM 的 package.json 解析崩（Windows 编辑器常见写入）。
      # 任何受监管文本文件（JSON/TS/Vue/CSS/MD/Python/MJS）首字节为 EF BB BF 即失败，防复发。
      - name: BOM guard
        run: |
          set -e
          for f in $(git ls-files | grep -E '\.(json|ts|tsx|js|mjs|jsx|vue|css|md|html|py)$'); do
            if [ -n "$(head -c 3 "$f" | grep -P '^\xef\xbb\xbf')" ]; then
              echo "::error file=$f::UTF-8 BOM 被禁止（PostCSS/Vite JSON 解析会崩）"
              exit 1
            fi
          done
      # 测试与双类型检查接入 CI —— 绿了才继续构建/部署
      - run: npm run typecheck:test
      - run: npm run test
      # 字体子集新鲜度：站内语料新增用字后必须重跑 scripts/subset_fonts.py，
      # 否则新字无字形（回退系统字体）。--check 纯标准库， runner 自带 python3 即可。
      - name: Font subset freshness
        run: python3 ../scripts/subset_fonts.py --check
      # 旧地址跳转页（不是镜像站，也不构建应用）：保留路径/参数/hash 跳到权威域名同位置；
      # meta refresh 兜底无 JS；canonical 归并权威域名根，旧收录随跳转转移。
      # 域名从 site.config.json 取（唯一来源），不要在这里写死字面量。
      - name: Build redirect stub
        run: |
          set -e
          ORIGIN=$(python3 -c "import json;print(json.load(open('site.config.json'))['origin'])")
          echo "权威域名：$ORIGIN"
          mkdir -p redirect-dist
          cat > redirect-dist/index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
          <meta charset="UTF-8">
          <title>中文兔子洞冰山图已搬迁</title>
          <link rel="canonical" href="$ORIGIN/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=$ORIGIN/">
          <script>(function(){var p=location.pathname.replace(/^\/iceberg_reforged/,'')||'/';location.replace('$ORIGIN'+p+location.search+location.hash);})();</script>
          </head>
          <body>
          <p>本站已搬迁至 <a href="$ORIGIN/">$ORIGIN</a>，正在跳转……</p>
          </body>
          </html>
          EOF
          cp redirect-dist/index.html redirect-dist/404.html
          # 守卫：跳转页里的域名必须与 site.config.json 一致（防两处漂移）
          grep -q "$ORIGIN" redirect-dist/index.html || { echo "::error::跳转页域名与 site.config.json 不一致"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iceberg-vue/redirect-dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
